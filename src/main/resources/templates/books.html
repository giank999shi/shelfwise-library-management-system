<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Books')}"></head>
<body>
<aside th:replace="~{fragments :: topbar}"></aside>
<main>
  <div class="page-head">
    <div>
      <h1>Manage Books</h1>
      <p class="sub">Add, edit or delete books. The Book ID is what you type when borrowing.</p>
    </div>
    <a class="btn" th:href="@{/staff/books/new}">+ Add book</a>
  </div>
  <div th:replace="~{fragments :: messages}"></div>

  <table class="table">
    <thead><tr><th>Cover</th><th>ID</th><th>Title</th><th>Author</th><th>Available</th><th>Total</th><th></th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="empty">No books yet. Click “Add book”.</td></tr>
      <tr th:each="b : ${books}">
        <td><img class="table-cover" th:if="${b.imagePath != null}" th:src="@{${b.imagePath}}" th:alt="${b.title} + ' cover'"><span th:unless="${b.imagePath != null}" class="muted">—</span></td>
        <td th:text="${b.id}"></td>
        <td th:text="${b.title}"></td>
        <td th:text="${b.author}"></td>
        <td>
          <span class="badge" th:classappend="${b.availableCopies > 0} ? 'badge-ok' : 'badge-bad'"
                th:text="${b.availableCopies}">1</span>
        </td>
        <td th:text="${b.totalCopies}"></td>
        <td>
          <div class="actions">
            <a class="btn btn-ghost btn-sm" th:href="@{/staff/books/{id}/edit(id=${b.id})}">Edit</a>
            <form class="inline" th:action="@{/staff/books/{id}/delete(id=${b.id})}" method="post"
                  onsubmit="return confirm('Delete this book? This cannot be undone.');">
              <button class="btn btn-danger btn-sm" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
