<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${report.title})}"></head>
<body>
<aside th:replace="~{fragments :: topbar}"></aside>
<main>
  <div class="page-head">
    <div>
      <h1 th:text="${report.title}">Report</h1>
      <p class="sub" th:text="${report.description}">Description</p>
    </div>
    <div class="actions no-print">
      <button class="btn btn-ghost" type="button" onclick="window.print()">Print</button>
      <a class="btn" th:href="@{/staff/reports/{slug}/csv(slug=${type.slug})}">Export CSV</a>
      <a class="btn btn-ghost" th:href="@{/staff/reports}">Back to reports</a>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr><th th:each="h : ${report.headers}" th:text="${h}">Header</th></tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(report.rows)}">
        <td th:colspan="${#lists.size(report.headers)}" class="empty">No data for this report yet.</td>
      </tr>
      <tr th:each="row : ${report.rows}">
        <td th:each="c : ${row}" th:text="${c}">cell</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
