# ---- MySQL connection ---------------------------------------------------
# The database "school_library" is created automatically if it doesn't exist,
# and the tables are created automatically on first run.
# >>> Change the password below to YOUR MySQL root password. <<<
spring.datasource.url=jdbc:mysql://localhost:3306/school_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=qwerty123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080

# Show the "Try a demo account" buttons on the sign-in page. Set to false before real use.
app.demo-accounts=true
spring.mvc.ignore-default-model-on-redirect=true

# Book cover uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads/books
