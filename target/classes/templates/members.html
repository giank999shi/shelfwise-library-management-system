<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Members')}"></head>
<body>
<aside th:replace="~{fragments :: topbar}"></aside>
<main>
  <div class="page-head">
    <div>
      <h1>Manage Members</h1>
      <p class="sub">Students and teachers who can borrow books. The Member ID is what you type when borrowing.</p>
    </div>
    <a class="btn" th:href="@{/staff/members/new}">+ Add member</a>
  </div>
  <div th:replace="~{fragments :: messages}"></div>

  <form th:action="@{/staff/members}" method="get" class="card form-row">
    <div style="flex:1; min-width:200px">
      <label for="keyword">Search by name</label>
      <input id="keyword" name="keyword" type="text" th:value="${keyword}" style="width:100%">
    </div>
    <button class="btn" type="submit">Search</button>
    <a class="btn btn-ghost" th:href="@{/staff/members}">Show all</a>
  </form>

  <table class="table">
    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(members)}"><td colspan="5" class="empty">No members found.</td></tr>
      <tr th:each="m : ${members}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.name}"></td>
        <td th:text="${m.memberType.label}"></td>
        <td>
          <span class="badge" th:classappend="${m.active} ? 'badge-ok' : 'badge-bad'"
                th:text="${m.active} ? 'Active' : 'Inactive'">Active</span>
        </td>
        <td>
          <div class="actions">
            <a class="btn btn-ghost btn-sm" th:href="@{/staff/members/{id}/edit(id=${m.id})}">Edit</a>
            <form class="inline" th:action="@{/staff/members/{id}/delete(id=${m.id})}" method="post"
                  onsubmit="return confirm('Delete this member? This cannot be undone.');">
              <button class="btn btn-danger btn-sm" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
